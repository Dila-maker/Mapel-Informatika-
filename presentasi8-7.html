                options: ["Router", "Kabel UTP", "Printer", "Mouse"],

                q: "4. Teknologi nirkabel jarak dekat yang sering dipakai untuk menghubungkan HP ke speaker tanpa kabel adalah...",

                options: ["Kompresi", "Enkripsi", "Download", "Streaming"],

        // Initialize App on Load
        window.onload = function() {
            goToView('welcome');

        // View Management
        function goToView(viewName, chapterIdx = 0) {
            currentView = viewName;
            currentChapterIndex = chapterIdx;
            currentSlideIndex = 0;
            render();
        }

        function startChapter(idx) {
            currentChapterIndex = idx;
            currentSlideIndex = 0;
            currentView = 'chapter';
            render();
        }

        function nextSlide() {
            if (currentView === 'chapter') {
                const chap = chapters[currentChapterIndex];
                if (currentSlideIndex < chap.slides.length - 1) {
                    currentSlideIndex++;
                    render();
                } else {
                    if (currentChapterIndex < chapters.length - 1) {
                        showModal("Hebat! 🎉", `Bab ${currentChapterIndex + 1} selesai! Mari lanjut ke petualangan berikutnya.`, "fa-solid fa-flag-checkered");
                        goToView('map');
                    } else {
                        goToView('boss');
                    }
                }
            } else if (currentView === 'boss') {
                if (currentBossIndex < bossChallenges.length - 1) {
                    currentBossIndex++;
                    render();
                } else {
                    goToView('celebration');
                }
            }
        }

        function prevSlide() {
            if (currentView === 'chapter') {
                if (currentSlideIndex > 0) {
                    currentSlideIndex--;
                    render();
                } else {
                    goToView('map');
                }
            } else if (currentView === 'map') {
                goToView('welcome');
            } else if (currentView === 'boss') {
                if (currentBossIndex > 0) {
                    currentBossIndex--;
                    render();
                } else {
                    goToView('map');
                }
            }
        }

        // Keyboard Navigation
        function setupKeyboardListeners() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') {
                    nextSlide();
                } else if (e.key === 'ArrowLeft') {
                    prevSlide();
                }
            });
        }

        // Fullscreen Toggle
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    showModal("Info", "Mode fullscreen aktif.", "fa-solid fa-expand");
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Modal Helper
        function showModal(title, message, iconClass = "fa-solid fa-circle-check") {
            const mTitle = document.getElementById('modal-title');
            const mMsg = document.getElementById('modal-message');
            const mIcon = document.getElementById('modal-icon');
            if (mTitle) mTitle.innerText = title;
            if (mMsg) mMsg.innerHTML = message;
            if (mIcon) mIcon.innerHTML = `<i class="${iconClass}"></i>`;
            const modalEl = document.getElementById('custom-modal');
            if (modalEl) modalEl.classList.remove('hidden');
        }

        function closeModal() {
            const modalEl = document.getElementById('custom-modal');
            if (modalEl) modalEl.classList.add('hidden');
        }

        // Core Render Function
        function render() {
            const container = document.getElementById('main-container');
            const headerIndicator = document.getElementById('header-indicator');
            const bottomControls = document.getElementById('bottom-controls');

            if (!container) return;
            container.innerHTML = '';

            if (currentView === 'welcome') {
                if (headerIndicator) headerIndicator.classList.add('hidden');
                if (bottomControls) bottomControls.classList.add('hidden');
                container.innerHTML = renderWelcomeView();
            } else if (currentView === 'map') {
                if (headerIndicator) headerIndicator.classList.remove('hidden');
                const cTitle = document.getElementById('current-chapter-title');
                const sDots = document.getElementById('slide-dots');
                if (cTitle) cTitle.innerText = "Peta Petualangan Utama";
                if (sDots) sDots.innerHTML = '<span class="text-xs text-brandCyan font-semibold">Pilih Wilayah Bab</span>';
                if (bottomControls) bottomControls.classList.add('hidden');
                container.innerHTML = renderMapView();
            } else if (currentView === 'chapter') {
                if (headerIndicator) headerIndicator.classList.remove('hidden');
                if (bottomControls) bottomControls.classList.remove('hidden');

                const cTitle = document.getElementById('current-chapter-title');
                if (cTitle) cTitle.innerText = chap.title;
                
                let dotsHtml = '';
                chap.slides.forEach((s, idx) => {
                    let active = idx === currentSlideIndex ? 'bg-brandCyan w-6' : 'bg-white/30 w-2';
                    dotsHtml += `<span class="h-2 rounded-full transition-all duration-300 ${active}"></span>`;
                });
                const sDots = document.getElementById('slide-dots');
                if (sDots) sDots.innerHTML = dotsHtml;

                container.innerHTML = renderChapterSlideView(chap, currentSlideIndex);
                
                // Initialize specific game scripts if slide requires it
                const slide = chap.slides[currentSlideIndex];
                if (slide.type === 'game-circuit') {
                    setTimeout(initCircuitGame, 100);
                } else if (slide.type === 'game-packet') {
                    setTimeout(initPacketGame, 100);
                }
            } else if (currentView === 'boss') {
                if (headerIndicator) headerIndicator.classList.remove('hidden');
                const cTitle = document.getElementById('current-chapter-title');
                const sDots = document.getElementById('slide-dots');
                if (cTitle) cTitle.innerText = "⚔️ Arena: Boss Battle (Ujian Akhir)";
                if (sDots) sDots.innerHTML = `<span class="text-xs text-brandPink font-semibold">Soal ${currentBossIndex + 1} dari ${bossChallenges.length}</span>`;
                if (bottomControls) bottomControls.classList.add('hidden');
                container.innerHTML = renderBossView();
            } else if (currentView === 'celebration') {
                if (headerIndicator) headerIndicator.classList.add('hidden');
                if (bottomControls) bottomControls.classList.add('hidden');
                container.innerHTML = renderCelebrationView();
            }
        }

        // --- Game 1: Circuit Puzzle Logic ---
        let circuitTiles = [
            { id: 0, icon: "💻", name: "Client PC", rotated: false },
            { id: 1, icon: "🛜", name: "Switch LAN", rotated: true },
            { id: 2, icon: "🌐", name: "Router Utama", rotated: false },
            { id: 3, icon: "📡", name: "Access Point", rotated: true },
            { id: 4, icon: "🖧", name: "Hub Lokal", rotated: true },
            { id: 5, icon: "🖥️", name: "Server Cloud", rotated: false }
        ];

        function initCircuitGame() {
            const grid = document.getElementById('circuit-grid');
            if (!grid) return;
            grid.innerHTML = '';
            circuitTiles.forEach((tile, i) => {
                let statusColor = tile.rotated ? 'border-red-500/60 bg-red-950/30' : 'border-emerald-400/80 bg-emerald-950/30 glow-box';
                let indicator = tile.rotated ? '🔴 Terputus' : '🟢 Terhubung';
                grid.innerHTML += `
                    <div onclick="toggleTile(${i})" class="glass-panel p-3 rounded-2xl cursor-pointer transition border ${statusColor} text-center flex flex-col items-center justify-center hover:scale-105">
                        <div class="text-2xl mb-1">${tile.icon}</div>
                        <div class="text-xs font-bold text-white">${tile.name}</div>
                        <div class="text-[10px] mt-1 font-mono">${indicator}</div>
                    </div>
                `;
            });
        }

        function toggleTile(idx) {
            circuitTiles[idx].rotated = !circuitTiles[idx].rotated;
            initCircuitGame();
        }

        function rotateCircuitTiles() {
            circuitTiles.forEach(t => t.rotated = Math.random() < 0.5);
            initCircuitGame();
            const statusEl = document.getElementById('circuit-status');
            if (statusEl) statusEl.innerText = "Status: Jalur diacak! Putar ubin yang merah menjadi hijau.";
        }

        function verifyCircuit() {
            let allConnected = circuitTiles.every(t => !t.rotated);
            const statusEl = document.getElementById('circuit-status');
            if (allConnected) {
                if (statusEl) statusEl.innerHTML = "<span class='text-emerald-400 font-bold'>🎉 Jaringan Sukses Terhubung Sempurna! Paket data siap mengalir ke internet.</span>";
                showModal("Topologi Jaringan Berhasil! 🛜", "Seluruh perangkat (Client, Switch, Router, Server) telah terhubung tanpa ada kabel yang putus.", "fa-solid fa-network-wired");
            } else {
                if (statusEl) statusEl.innerHTML = "<span class='text-rose-400 font-bold'>⚠️ Masih ada lampu merah (kabel terputus). Ketuk ubin untuk memutarnya!</span>";
            }
        }

        // --- Game 2: Packet Delivery Express (Arcade Simulator) ---
        let packetGameInterval = null;
        let packetPos = { x: 50, y: 100, lane: 1 }; // lane 0: top, 1: mid, 2: bot
        let packetScore = 0;
        let obstacles = [];

        function startPacketGame() {
            const canvas = document.getElementById('packetCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            packetScore = 0;
            packetPos.lane = 1;
            obstacles = [
                { x: 250, lane: 0, speed: 2 },
                { x: 380, lane: 2, speed: 2.5 }
            ];

            if (packetGameInterval) clearInterval(packetGameInterval);

            packetGameInterval = setInterval(() => {
                // Update obstacles
                obstacles.forEach(obs => {
                    obs.x -= 3;
                    if (obs.x < -20) {
                        obs.x = canvas.width + Math.random() * 100;
                        obs.lane = Math.floor(Math.random() * 3);
                        packetScore += 5;
                    }
                    // Collision check
                    if (Math.abs(obs.x - packetPos.x) < 25 && obs.lane === packetPos.lane) {
                        packetScore = Math.max(0, packetScore - 10);
                        obs.x = canvas.width + 50; // reset on hit
                    }
                });

                // Render Canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw lanes
                ctx.strokeStyle = 'rgba(143, 246, 255, 0.2)';
                ctx.lineWidth = 2;
                [40, 100, 160].forEach(y => {
                    ctx.beginPath();
                    ctx.setLineDash([5, 5]);
                    ctx.moveTo(20, y);
                    ctx.lineTo(canvas.width - 20, y);
                    ctx.stroke();
                });

                // Draw packet (Player)
                let targetY = 40 + packetPos.lane * 60;
                ctx.fillStyle = '#8FF6FF';
                ctx.shadowColor = '#8FF6FF';
                ctx.shadowBlur = 12;
                ctx.fillRect(packetPos.x, targetY - 15, 30, 30);
                ctx.fillStyle = '#120826';
                ctx.font = '14px sans-serif';
                ctx.fillText('📦', packetPos.x + 5, targetY + 5);

                // Draw Malware (Obstacles)
                ctx.shadowColor = '#FCA3FF';
                obstacles.forEach(obs => {
                    let obsY = 40 + obs.lane * 60;
                    ctx.fillStyle = '#FCA3FF';
                    ctx.fillRect(obs.x, obsY - 15, 26, 26);
                    ctx.fillStyle = '#120826';
                    ctx.fillText('👾', obs.x + 3, obsY + 5);
                });
                ctx.shadowBlur = 0;

                const scoreEl = document.getElementById('packet-score');
                if (scoreEl) scoreEl.innerText = `Skor Paket Terkirim: ${packetScore} | Hindari Malware (👾)!`;
            }, 30);
        }

        function movePacketUp() {
            if (packetPos.lane > 0) packetPos.lane--;
        }

        function movePacketDown() {
            if (packetPos.lane < 2) packetPos.lane++;
        }

        // --- Game 3: Sorting Game (Kabel vs Nirkabel) ---
        const sortingItems = [
            { name: "🔌 Kabel UTP (LAN RJ45)", type: "wired" },
            { name: "📶 Wi-Fi Router Rumah", type: "wireless" },
            { name: "📡 Bluetooth Mouse & Speaker", type: "wireless" },
            { name: "🧵 Kabel Serat Optik (Fiber Optic)", type: "wired" },
            { name: "📳 Hotspot Seluler HP (Tethering)", type: "wireless" },
            { name: "🔗 Kabel Coaxial TV", type: "wired" }
        ];
        let sortingIndex = 0;
        let sortingCorrectCount = 0;

        function sortItemAnswer(chosenType) {
            const current = sortingItems[sortingIndex];
            const scoreEl = document.getElementById('sorting-score');
            const itemEl = document.getElementById('current-sort-item');

            if (current.type === chosenType) {
                sortingCorrectCount++;
                if (scoreEl) scoreEl.innerHTML = `<span class='text-emerald-400'>✅ Benar! Kategori tepat.</span> Skor: ${sortingCorrectCount} / ${sortingItems.length}`;
            } else {
                if (scoreEl) scoreEl.innerHTML = `<span class='text-rose-400'>❌ Kurang tepat. Perhatikan jenis medianya.</span>`;
            }

            sortingIndex++;
            if (sortingIndex < sortingItems.length) {
                setTimeout(() => {
                    if (itemEl) itemEl.innerText = sortingItems[sortingIndex].name;
                }, 600);
            } else {
                if (itemEl) itemEl.innerText = "🎉 Selesai! Semua media transmisi berhasil diklasifikasikan.";
                showModal("Klasifikasi Selesai! 📦", `Hebat! Anda berhasil mengelompokkan seluruh perangkat kabel dan nirkabel dengan benar.`, "fa-solid fa-trophy");
            }
        }

        // Interactive Helper Functions
        function checkGameChoice(el, type) {
            const feedback = document.getElementById('game-feedback');
            if (type === 'hardware') {
                if (feedback) feedback.innerHTML = `<span class="text-emerald-400">✅ Tepat! Ini adalah Perangkat Keras (Hardware) nyata.</span>`;
            } else {
                if (feedback) feedback.innerHTML = `<span class="text-brandPink">✅ Tepat! Ini adalah Perangkat Lunak (Software) aplikasi.</span>`;
            }
            el.classList.add('border-brandCyan', 'bg-brandCyan/20');
        }

        function convertBinary() {
            const inputEl = document.getElementById('binary-input');
            const resEl = document.getElementById('binary-result');
            if (!inputEl || !resEl) return;
            const val = inputEl.value.trim();
            try {
                const dec = parseInt(val, 2);
                if (isNaN(dec)) {
                    resEl.innerText = "❌ Masukkan hanya angka 0 dan 1!";
                } else {
                    resEl.innerText = `Hasil Desimal dari biner ${val} adalah: ${dec}`;
                }
            } catch (e) {
                resEl.innerText = "Format biner tidak valid.";
            }
        }

        function encryptText() {
            const plainEl = document.getElementById('plain-text');
            const resEl = document.getElementById('encrypt-result');
            if (!plainEl || !resEl) return;
            const text = plainEl.value;
            let encrypted = '';
            for (let i = 0; i < text.length; i++) {
                let code = text.charCodeAt(i);
                encrypted += String.fromCharCode(code + 3);
            }
            resEl.innerHTML = `Hasil Sandi Terenkripsi: <span class="text-brandPink font-bold">${encrypted}</span>`;
        }

        function checkQuizAnswer(selectedIdx, correctIdx, explanation) {
            const feedback = document.getElementById('quiz-feedback');
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`opt-${i}`);
                if (btn) {
                    btn.classList.remove('bg-emerald-600/40', 'bg-rose-600/40');

            }
            if (selectedIdx === correctIdx) {
                if (feedback) feedback.innerHTML = `<span class="text-emerald-400">🎉 Benar sekali! ${explanation}</span>`;
            } else {
                if (feedback) feedback.innerHTML = `<span class="text-rose-400">❌ Kurang tepat. ${explanation}</span>`;

        function checkBossAnswer(selectedIdx, correctIdx) {
            const feedback = document.getElementById('boss-feedback');
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`boss-opt-${i}`);
                if (btn) {
                    if (i === correctIdx) btn.classList.add('bg-emerald-600/40', 'border-emerald-400');
                    if (i === selectedIdx && i !== correctIdx) btn.classList.add('bg-rose-600/40', 'border-rose-400');
                }

            if (selectedIdx === correctIdx) {
                bossScore += 10;
                if (feedback) feedback.innerHTML = `<span class="text-emerald-400">✅ Jawaban Tepat! Melanjutkan...</span>`;

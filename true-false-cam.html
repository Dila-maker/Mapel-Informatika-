<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Edukasi: Bergerak ke Benar atau Salah</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; /* Mencegah scroll */
        }

        /* Header Soal */
        .header {
            background: #16213e;
            padding: 15px;
            text-align: center;
            border-bottom: 4px solid #ff4081;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .header h2 {
            color: #e94560;
            margin-bottom: 5px;
            font-size: 1.2em;
        }

        #questionText {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Area Layar Terbagi Dua */
        .game-area {
            display: flex;
            flex: 1;
            position: relative;
            transition: transform 0.1s; /* Untuk animasi getar */
        }

        /* Sisi Hijau (Kiri) */
        .side-green {
            flex: 1;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 4px dashed #fff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .side-green:hover {
            background: linear-gradient(135deg, #0e8a7e, #2dd46b);
        }

        /* Sisi Merah (Kanan) */
        .side-red {
            flex: 1;
            background: linear-gradient(135deg, #cb2d3e, #ef473a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .side-red:hover {
            background: linear-gradient(135deg, #b02635, #d93d30);
        }

        .side-green h1, .side-red h1 {
            font-size: 4em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .side-green p, .side-red p {
            font-size: 1.5em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Tombol Guru (Kontrol) */
        .control-panel {
            background: #0f3460;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            border-top: 4px solid #e94560;
            z-index: 10;
        }

        .btn-control {
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
        }

        .btn-show {
            background: #fca311;
            color: #000;
            box-shadow: 0 5px 0 #b87a0d;
        }

        .btn-next {
            background: #00b4d8;
            color: white;
            box-shadow: 0 5px 0 #0077b6;
        }

        .btn-control:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .btn-control:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: translateY(5px);
            box-shadow: none;
        }

        /* Overlay Animasi */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8em;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.3s;
        }

        .overlay.show {
            opacity: 1;
        }

        /* Animasi Getar untuk Salah */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        /* Animasi Confetti (Menggunakan Canvas) */
        #confettiCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 15;
            display: none;
        }

        /* Skor */
        .score-display {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2em;
            z-index: 30;
        }
    </style>
</head>
<body>

    <!-- Header Pertanyaan -->
    <div class="header">
        <h2 id="questionNumber">Soal 1 dari 5</h2>
        <div id="questionText">Memuat pertanyaan...</div>
    </div>

    <!-- Area Permainan -->
    <div class="game-area" id="gameArea">
        <!-- Sisi Hijau -->
        <div class="side-green" onclick="pilihSisi('benar')">
            <h1>👍</h1>
            <p>BENAR</p>
        </div>
        <!-- Sisi Merah -->
        <div class="side-red" onclick="pilihSisi('salah')">
            <h1>👎</h1>
            <p>SALAH</p>
        </div>

        <!-- Overlay Animasi -->
        <div class="overlay" id="overlayAnim"></div>
        <canvas id="confettiCanvas"></canvas>
    </div>

    <!-- Panel Kontrol Guru -->
    <div class="control-panel">
        <div class="score-display">Skor: <span id="score">0</span></div>
        <button class="btn-control btn-show" id="btnShow" onclick="tunjukkanJawaban()">TUNJUKKAN JAWABAN</button>
        <button class="btn-control btn-next" id="btnNext" onclick="soalBerikutnya()" disabled>SOAL BERIKUTNYA ➡️</button>
    </div>

    <script>
        // Data Soal (Materi Sistem Komputer)
        const questions = [
            { q: "Hardware adalah perangkat fisik komputer yang dapat dilihat dan disentuh.", a: "benar" },
            { q: "Software adalah komponen komputer yang berbentuk fisik dan berwujud.", a: "salah" },
            { q: "Brainware adalah manusia yang menggunakan dan mengoperasikan komputer.", a: "benar" },
            { q: "Monitor dan Keyboard termasuk ke dalam kategori Software.", a: "salah" },
            { q: "Sistem Operasi (Windows/Linux) adalah contoh dari Brainware.", a: "salah" }
        ];

        let currentIndex = 0;
        let score = 0;
        let pilihanSiswa = null; // Menyimpan pilihan sisi (benar/salah)
        let sudahDijawab = false;

        // Elemen DOM
        const questionNumber = document.getElementById('questionNumber');
        const questionText = document.getElementById('questionText');
        const scoreEl = document.getElementById('score');
        const btnShow = document.getElementById('btnShow');
        const btnNext = document.getElementById('btnNext');
        const overlayAnim = document.getElementById('overlayAnim');
        const gameArea = document.getElementById('gameArea');
        const canvas = document.getElementById('confettiCanvas');

        // Fungsi Load Soal
        function loadQuestion() {
            if (currentIndex >= questions.length) {
                questionText.innerText = "🎉 Permainan Selesai!";
                questionNumber.innerText = "Terima Kasih";
                btnShow.disabled = true;
                btnNext.disabled = true;
                overlayAnim.innerText = "🏆";
                overlayAnim.classList.add('show');
                return;
            }
            sudahDijawab = false;
            pilihanSiswa = null;
            questionNumber.innerText = `Soal ${currentIndex + 1} dari ${questions.length}`;
            questionText.innerText = questions[currentIndex].q;
            
            // Reset tombol
            btnShow.disabled = false;
            btnNext.disabled = true;
            overlayAnim.classList.remove('show');
            overlayAnim.innerText = "";
            canvas.style.display = 'none';
        }

        // Fungsi saat Guru mengklik Sisi (atau siswa menyentuh layar)
        function pilihSisi(pilihan) {
            if (sudahDijawab) return; // Jika sudah dikunci, tidak bisa ganti
            pilihanSiswa = pilihan;
            
            // Efek visual saat memilih
            if (pilihan === 'benar') {
                document.querySelector('.side-green').style.border = "8px solid yellow";
                document.querySelector('.side-red').style.border = "none";
            } else {
                document.querySelector('.side-red').style.border = "8px solid yellow";
                document.querySelector('.side-green').style.border = "none";
            }
        }

        // Fungsi Guru menekan "Tunjukkan Jawaban"
        function tunjukkanJawaban() {
            if (sudahDijawab) return;
            if (!pilihanSiswa) {
                alert("Siswa belum memilih sisi! Silakan pilih area Hijau atau Merah terlebih dahulu.");
                return;
            }

            sudahDijawab = true;
            btnShow.disabled = true;
            btnNext.disabled = false;

            const jawabanBenar = questions[currentIndex].a;
            
            // Hapus border pilihan
            document.querySelector('.side-green').style.border = "none";
            document.querySelector('.side-red').style.border = "none";

            // Cek Jawaban
            if (pilihanSiswa === jawabanBenar) {
                // JAWABAN BENAR
                score += 20;
                scoreEl.innerText = score;
                
                // Animasi Benar
                overlayAnim.innerText = "✅ BENAR!";
                overlayAnim.style.color = "#4caf50";
                overlayAnim.classList.add('show');
                
                // Jalankan Confetti
                canvas.style.display = 'block';
                startConfetti();
                
                // Sembunyikan overlay setelah 2 detik
                setTimeout(() => {
                    overlayAnim.classList.remove('show');
                    canvas.style.display = 'none';
                }, 2500);

            } else {
                // JAWABAN SALAH
                overlayAnim.innerText = "❌ SALAH!";
                overlayAnim.style.color = "#f44336";
                overlayAnim.classList.add('show');
                
                // Animasi Getar pada layar
                gameArea.classList.add('shake');
                setTimeout(() => {
                    gameArea.classList.remove('shake');
                }, 500);

                // Sembunyikan overlay setelah 2 detik
                setTimeout(() => {
                    overlayAnim.classList.remove('show');
                }, 2000);
            }
        }

        // Fungsi Lanjut ke Soal Berikutnya
        function soalBerikutnya() {
            currentIndex++;
            loadQuestion();
        }

        // --- Logika Confetti Sederhana ---
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;

        function startConfetti() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    speedY: Math.random() * 3 + 2,
                    speedX: Math.random() * 2 - 1,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            
            particles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;
                
                // Gambar persegi panjang sebagai confetti
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size * 0.6);
                
                if (p.y < canvas.height) active = true;
            });

            if (active) {
                animationId = requestAnimationFrame(animateConfetti);
            } else {
                cancelAnimationFrame(animationId);
            }
        }

        // Mulai Game
        window.onload = () => {
            loadQuestion();
        };

        // Sesuaikan ukuran canvas jika layar berubah
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>

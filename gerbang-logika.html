    <script>
        // Sound FX System using Web Audio API
        let soundEnabled = true;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(140, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'toggle') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.setValueAtTime(900, now + 0.04);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.type = 'triangle';
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.frequency.setValueAtTime(freq, now + idx * 0.08);
                        g.gain.setValueAtTime(0.15, now + idx * 0.08);
                        g.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.25);
                        o.start(now + idx * 0.08);
                        o.stop(now + idx * 0.08 + 0.25);
                    });
                }
            } catch(e) {
                console.log('Audio playback error:', e);
            }
        }

        // Simple Canvas Confetti
        function triggerConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#facc15', '#38bdf8', '#4ade80', '#f43f5e', '#a855f7', '#fb923c'];

            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 16,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 10
                });
            }

            let start = null;
            function animate(timestamp) {
                if (!start) start = timestamp;
                const progress = timestamp - start;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3; // gravity
                    p.rotation += p.rotationSpeed;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                if (progress < 2500) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            requestAnimationFrame(animate);
            playSound('win');
        }

                        <h3 class="font-bold text-white text-lg sm:text-xl mb-6">
                            "${question}"
                        </h3>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                            ${options.map(opt => {
                                const isSelected = selectedKey === opt.key;
                                return `
                                    <button onclick="selectQuizAnswer('${quizKey}', '${opt.key}', ${opt.correct})" class="p-4 rounded-xl text-left font-bold transition flex items-center justify-between border ${isSelected ? (opt.correct ? 'bg-emerald-600 border-emerald-400 text-white' : 'bg-rose-600 border-rose-400 text-white') : 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-slate-200'}">
                                        <span>${opt.key}. ${opt.text}</span>
                                        ${isSelected ? (opt.correct ? '✅' : '❌') : ''}
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        ${selectedKey ? `
                            <div class="p-4 rounded-xl bg-slate-900/90 border border-slate-700 text-xs sm:text-sm text-slate-300">
                                <strong class="text-amber-400">Penjelasan Guru:</strong> ${explanation}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function selectQuizAnswer(key, optKey, isCorrect) {
            quizState[key] = optKey;
            if (isCorrect) {
                playSound('correct');
                triggerConfetti();
            } else {
                playSound('wrong');
            }
            renderSlide();
        }

        window.onload = function() {
            renderSlide();
            updateNavigationUI();
        };
    </script>
</body>
</html>

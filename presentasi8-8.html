<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Jaringan Komputer & Internet - SMPN 1 Tinggimoncong</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF00FF;
            --secondary: #FF0000;
            --bg-dark: #0F051D;
            --bg-card: #1E0B36;
            --white: #FFFFFF;
            --accent: #00FFFF;
            --success: #00FF66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Background Animated Glow */
        .bg-glow {
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 20% 30%, rgba(255,0,255,0.15) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(255,0,0,0.15) 0%, transparent 40%);
            z-index: -1;
        }

        /* Top Bar / Header */
        header {
            background: rgba(30, 11, 54, 0.9);
            border-bottom: 3px solid var(--primary);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(255,0,255,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .school-info h1 {
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .school-info p {
            font-size: 0.8rem;
            color: #ddd;
        }

        .top-tools {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-tool {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,0,255,0.5);
            transition: 0.2s;
        }

        .btn-tool:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--primary);
        }

        /* Main Presentation Container */
        .main-container {
            max-width: 1050px;
            width: 92%;
            margin: 25px auto;
            background: var(--bg-card);
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.25);
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .slide-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px dashed rgba(255,255,255,0.2);
            padding-bottom: 12px;
        }

        .badge-chapter {
            background: var(--secondary);
            color: var(--white);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 0 0 10px var(--secondary);
        }

        .slide-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--white);
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .slide-content {
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 25px;
            color: #f0f0f0;
        }

        /* Grid Layouts inside slides */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .card-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 20px;
            transition: 0.3s;
        }

        .card-box:hover {
            background: rgba(255, 0, 255, 0.1);
            transform: translateY(-3px);
        }

        /* Navigation Footer */
        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }

        .nav-btn {
            background: var(--white);
            color: var(--bg-dark);
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background: var(--primary);
            color: var(--white);
            box-shadow: 0 0 15px var(--primary);
        }

        .slide-indicator {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent);
            letter-spacing: 2px;
        }

        /* Interactive Minigames Styling */
        .game-area {
            background: rgba(0, 0, 0, 0.3);
            border: 2px dashed var(--accent);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-top: 15px;
        }

        .game-options {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .game-opt-btn {
            background: #2a1045;
            color: var(--white);
            border: 2px solid var(--primary);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .game-opt-btn:hover {
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        /* Modal Popups (Feedback & Random Picker) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-card);
            border: 3px solid var(--primary);
            padding: 30px;
            border-radius: 20px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px var(--primary);
        }

        .modal-content h3 {
            font-size: 1.6rem;
            margin-bottom: 15px;
            color: var(--accent);
        }

        .modal-content p {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        /* Footer Info */
        footer {
            text-align: center;
            padding: 12px;
            font-size: 0.8rem;
            color: #aaa;
            background: rgba(15, 5, 29, 0.9);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* Responsive Design */
        @media(max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .slide-title { font-size: 1.4rem; }
            .main-container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <!-- Header / Identitas -->
    <header>
        <div class="school-info">
            <h1>SMPN 1 TINGGIMONCONG</h1>
            <p>Informatika Kelas 8 | Guru: Syarifuddin, S.Pd., M.Si.</p>
        </div>
        <div class="top-tools">
            <button class="btn-tool" onclick="openPicker()">🎯 Pilih Siswa</button>
            <button class="btn-tool" onclick="toggleFullscreen()">📺 Fullscreen</button>
        </div>
    </header>

    <!-- Main Slide Deck Area -->
    <main class="main-container" id="slide-container">
        <!-- Content will be injected dynamically via JS -->
    </main>

    <!-- Navigation Footer -->
    <div style="max-width: 1050px; width: 92%; margin: 0 auto 20px auto;">
        <div class="nav-footer">
            <button class="nav-btn" onclick="prevSlide()">⬅️ Sebelumnya</button>
            <div class="slide-indicator" id="indicator">Slide 1 / 11</div>
            <button class="nav-btn" onclick="nextSlide()">Berikutnya ➡️</button>
        </div>
    </div>

    <!-- Modal Feedback -->
    <div class="modal" id="feedbackModal">
        <div class="modal-content">
            <h3 id="modalTitle">Hasil Jawaban</h3>
            <p id="modalText">Pesan umpan balik di sini...</p>
            <button class="btn-tool" onclick="closeModal()">Tutup & Lanjutkan</button>
        </div>
    </div>

    <!-- Modal Random Student Picker -->
    <div class="modal" id="pickerModal">
        <div class="modal-content">
            <h3>🎯 Pemilih Siswa Aktif</h3>
            <p id="pickedName" style="font-size: 2rem; font-weight: bold; color: var(--primary); margin: 20px 0;">Siapakah yang beruntung?</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-tool" onclick="spinStudent()">Acak Siswa</button>
                <button class="btn-tool" style="background: #444;" onclick="closePicker()">Tutup</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Informatika SMPN 1 Tinggimoncong &bull; Dirancang untuk Pembelajaran Interaktif Berkualitas
    </footer>

    <script>
        // Web Audio API Sound generator (Zero external dependencies)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Slides Database
        const slides = [
            // Slide 1: Welcome Gate
            {
                badge: "Gerbang Pembuka",
                title: "🌟 PETUALANGAN JARINGAN KOMPUTER & INTERNET 🌟",
                content: `
                    <div style="text-align: center; padding: 20px;">
                        <p style="font-size: 1.2rem; margin-bottom: 20px;">Selamat datang di kelas interaktif Informatika Kelas 8 SMPN 1 Tinggimoncong!</p>
                        <div style="font-size: 3rem; margin: 20px 0;">🛜 🌐 💻 📡 📳</div>
                        <p style="color: var(--accent); font-weight: 600;">Siapkan dirimu menjelajahi dunia koneksi tanpa batas bersama Guru Syarifuddin, S.Pd., M.Si.</p>
                    </div>
                `
            },
            // Slide 2: Main Map Menu
            {
                badge: "Peta Petualangan",
                title: "🗺️ Peta Wilayah Pembelajaran",
                content: `
                    <p>Hari ini kita akan melintasi 5 pos utama penjelajahan:</p>
                    <div class="grid-2" style="margin-top: 15px;">
                        <div class="card-box"><strong>🏠 Bab 1:</strong> Konfigurasi Jaringan Komputer</div>
                        <div class="card-box"><strong>🔬 Lab:</strong> Konektivitas Data pada Ponsel</div>
                        <div class="card-box"><strong>🧩 Misteri:</strong> Berinternet dengan Aman</div>
                        <div class="card-box"><strong>⚔️ Arena:</strong> Perangkat & Protokol Jaringan</div>
                        <div class="card-box" style="grid-column: span 2;"><strong>🎬 Studio & 🏆 Boss:</strong> Teknologi Komunikasi & Ujian Akhir</div>
                    </div>
                `
            },
            // Slide 3: Bab 1 Materi & Game Sorting
            {
                badge: "Bab 1 — Konfigurasi Jaringan",
                title: "Konfigurasi Jaringan Komputer",
                content: `
                    <p>Jaringan komputer adalah sekumpulan komputer yang saling terhubung untuk berbagi sumber daya (data, printer, internet). Komponen utamanya meliputi <strong>Router</strong> (penghubung antar jaringan), <strong>Switch</strong> (penghubung dalam satu LAN), dan kabel UTP.</p>
                    <div class="game-area">
                        <p style="font-weight: bold; color: var(--accent);">🎮 Mini-Game: Manakah yang berfungsi sebagai penghubung antar jaringan (lintas jaringan)?</p>
                        <div class="game-options">
                            <button class="game-opt-btn" onclick="checkAnswer(false)">Switch LAN</button>
                            <button class="game-opt-btn" onclick="checkAnswer(true)">Router</button>
                            <button class="game-opt-btn" onclick="checkAnswer(false)">Kabel LAN</button>
                        </div>
                    </div>
                `
            },
            // Slide 4: Bab 2 Materi & Game Sinyal
            {
                badge: "Bab 2 — Konektivitas Data Ponsel",
                title: "Konektivitas Data & Seluler",
                content: `
                    <p>Ponsel cerdas terhubung ke internet melalui jaringan seluler (GSM/CDMA) dengan generasi teknologi yang terus berkembang dari 2G, 3G, 4G LTE, hingga kini 5G yang menawarkan kecepatan super tinggi dan latensi rendah.</p>
                    <div class="game-area">
                        <p style="font-weight: bold; color: var(--accent);">🎮 Kuis Cepat: Generasi seluler manakah yang membawa standar kecepatan tinggi (LTE) di atas 3G?</p>
                        <div class="game-options">
                            <button class="game-opt-btn" onclick="checkAnswer(false)">2G EDGE</button>
                            <button class="game-opt-btn" onclick="checkAnswer(true)">4G LTE</button>
                            <button class="game-opt-btn" onclick="checkAnswer(false)">Dial-up</button>
                        </div>
                    </div>
                `
            },
            // Slide 5: Bab 3 Materi & Game True/False
            {
                badge: "Bab 3 — Keamanan Berinternet",
                title: "Berinternet dengan Aman (Cybersecurity)",
                content: `
                    <p>Keamanan siber melindungi perangkat dan data pribadi kita dari pencurian, phising, dan malware. Jangan pernah membagikan kata sandi atau kode OTP kepada siapa pun!</p>
                    <div class="game-area">
                        <p style="font-weight: bold; color: var(--accent);">🔍 Mitos atau Fakta? "Memakai tanggal lahir sebagai password adalah hal yang sangat aman."</p>
                        <div class="game-options">
                            <button class="game-opt-btn" onclick="checkAnswer(false)">Fakta (Aman)</button>
                            <button class="game-opt-btn" onclick="checkAnswer(true)">Mitos (Mudah Ditebak!)</button>
                        </div>
                    </div>
                `
            },
            // Slide 6: Bab 4 Materi & Protokol
            {
                badge: "Bab 4 — Perangkat & Protokol",
                title: "Protokol Jaringan (IP Address & DNS)",
                content: `
                    <p><strong>IP Address</strong> adalah alamat unik setiap perangkat di jaringan (contoh: 192.168.1.1). Sedangkan <strong>DNS</strong> (Domain Name System) berfungsi menerjemahkan nama domain (seperti google.com) menjadi alamat IP.</p>
                    <div class="game-area">
                        <p style="font-weight: bold; color: var(--accent);">🎮 Tebak Istilah: Apa kepanjangan dari DNS dalam jaringan komputer?</p>
                        <div class="game-options">
                            <button class="game-opt-btn" onclick="checkAnswer(false)">Data Network System</button>
                            <button class="game-opt-btn" onclick="checkAnswer(true)">Domain Name System</button>
                            <button class="game-opt-btn" onclick="checkAnswer(false)">Digital Node Server</button>
                        </div>
                    </div>
                `
            },
            // Slide 7: Bab 5 Teknologi Komunikasi Ponsel
            {
                badge: "Bab 5 — Teknologi Ponsel",
                title: "Teknologi Nirkabel & Komunikasi",
                content: `
                    <p>Selain jaringan seluler, ponsel pintar menggunakan teknologi nirkabel jarak dekat seperti <strong>Bluetooth</strong> untuk transfer file cepat dan <strong>Wi-Fi</strong> untuk koneksi internet nirkabel berbasis router lokal.</p>
                    <div class="game-area">
                        <p style="font-weight: bold; color: var(--accent);">🎮 Kuis Singkat: Teknologi nirkabel jarak pendek untuk menghubungkan headset ke ponsel adalah...</p>
                        <div class="game-options">
                            <button class="game-opt-btn" onclick="checkAnswer(true)">Bluetooth</button>
                            <button class="game-opt-btn" onclick="checkAnswer(false)">Fiber Optic</button>
                            <button class="game-opt-btn" onclick="checkAnswer(false)">Kabel UTP</button>
                        </div>
                    </div>
                `
            },
            // Slide 8: Boss Battle (Turn-Based Challenge)
            {
                badge: "🏆 Boss Battle",
                title: "⚔️ Kalahkan Glitch Jaringan Raksasa!",
                content: `
                    <p>Gangguan jaringan menyerang sistem! Jawab pertanyaan berikut dengan benar untuk melumpuhkan Boss dan menyelesaikan misi utama!</p>
                    <div class="game-area" id="bossArea">
                        <p style="font-weight: bold; color: var(--secondary);" id="bossQuestion">Soal Boss: Perangkat keras apa yang berfungsi memancarkan sinyal Wi-Fi di rumah?</p>
                        <div class="game-options" id="bossOptions">
                            <button class="game-opt-btn" onclick="checkBoss(true)">Wireless Router / Access Point</button>
                            <button class="game-opt-btn" onclick="checkBoss(false)">Mouse & Keyboard</button>
                        </div>
                    </div>
                `
            },
            // Slide 9: Penutup & Rangkuman
            {
                badge: "Panggung Perayaan",
                title: "🎉 Petualangan Selesai!",
                content: `
                    <p>Hebat sekali! Kita telah merangkum poin-poin penting:</p>
                    <ul style="margin-left: 25px; margin-top: 10px; line-height: 1.8;">
                        <li>Komponen jaringan (Router, Switch, Kabel)</li>
                        <li>Konektivitas data seluler & generasi 4G/5G</li>
                        <li>Keamanan berinternet dan menjaga privasi data</li>
                        <li>Peran IP Address dan DNS</li>
                        <li>Teknologi nirkabel (Wi-Fi & Bluetooth)</li>
                    </ul>
                `
            }
        ];

        let currentSlide = 0;

        function renderSlide() {
            playSound('click');
            const slide = slides[currentSlide];
            const container = document.getElementById('slide-container');
            
            container.innerHTML = `
                <div>
                    <div class="slide-header">
                        <span class="badge-chapter">${slide.badge}</span>
                        <span style="font-size: 0.9rem; color: #aaa;">SMPN 1 Tinggimoncong</span>
                    </div>
                    <h2 class="slide-title">${slide.title}</h2>
                    <div class="slide-content">${slide.content}</div>
                </div>
            `;

            document.getElementById('indicator').innerText = `Slide ${currentSlide + 1} / ${slides.length}`;
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        }

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Game Verification
        function checkAnswer(isCorrect) {
            const modal = document.getElementById('feedbackModal');
            const title = document.getElementById('modalTitle');
            const text = document.getElementById('modalText');

            if (isCorrect) {
                playSound('correct');
                title.innerText = "🎉 Luar Biasa! Benar!";
                text.innerText = "Hebat! Pemahaman konsep jaringanmu sudah sangat baik.";
            } else {
                playSound('wrong');
                title.innerText = "❌ Kurang Tepat!";
                text.innerText = "Jangan menyerah, coba ingat kembali materi atau diskusikan bersama guru.";
            }
            modal.classList.add('active');
        }

        let bossHP = 2;
        function checkBoss(isCorrect) {
            if (isCorrect) {
                playSound('correct');
                bossHP--;
                if (bossHP <= 0) {
                    document.getElementById('bossArea').innerHTML = `
                        <h3 style="color: var(--success);">🏆 BOSS BERHASIL DIKALHKAN!</h3>
                        <p>Sistem jaringan kembali stabil dan aman!</p>
                    `;
                } else {
                    document.getElementById('bossQuestion').innerText = "Soal Tahap 2: Protokol apa yang mengamankan transfer halaman web (HTTPS)?";
                    document.getElementById('bossOptions').innerHTML = `
                        <button class="game-opt-btn" onclick="checkBossFinal(true)">SSL / TLS Security</button>
                        <button class="game-opt-btn" onclick="checkBossFinal(false)">Bluetooth Pairing</button>
                    `;
                }
            } else {
                playSound('wrong');
                alert("Serangan gagal! Coba pilih jawaban lain.");
            }
        }

        function checkBossFinal(isCorrect) {
            if (isCorrect) {
                playSound('correct');
                document.getElementById('bossArea').innerHTML = `
                    <h3 style="color: var(--success);">🏆 BOSS BERHASIL DIKALAHKAN!</h3>
                    <p>Sistem jaringan kembali stabil dan aman!</p>
                `;
            } else {
                playSound('wrong');
                alert("Kurang tepat, coba lagi!");
            }
        }

        function closeModal() {
            document.getElementById('feedbackModal').classList.remove('active');
        }

        // Random Student Picker
        const studentsList = [
            "Ahmad Zaki", "Aulia Zahra", "Bintang Pratama", "Citra Lestari", 
            "Farel Ahmad", "Keysha Putri", "Muhammad Rizky", "Nayla Salsabila", 
            "Rafi Ramadhan", "Siti Nurhaliza", "Wahyu Hidayat", "Zahra Amalia"
        ];

        function openPicker() {
            document.getElementById('pickerModal').classList.add('active');
        }

        function closePicker() {
            document.getElementById('pickerModal').classList.remove('active');
        }

        function spinStudent() {
            playSound('click');
            let count = 0;
            const nameEl = document.getElementById('pickedName');
            const interval = setInterval(() => {
                const randomStudent = studentsList[Math.floor(Math.random() * studentsList.length)];
                nameEl.innerText = randomStudent;
                count++;
                if (count > 12) {
                    clearInterval(interval);
                    playSound('correct');
                }
            }, 80);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Initial Render
        renderSlide();
